name: Deploy Flask Backend

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build -t chatbot-backend ./backend
          docker tag chatbot-backend YOUR_DOCKERHUB_USERNAME/chatbot-backend:latest
          docker push YOUR_DOCKERHUB_USERNAME/chatbot-backend:latest

      - name: Deploy to VM
        run: |
          echo "Deployment step here (e.g. ssh into VM and pull latest)"
